name: Verify app and OTP flows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and production build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production-123456789
      OTP_SECRET: ci-only-otp-secret-do-not-use-in-production-123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production app even when lint reports issues
        if: always()
        run: npm run build

  otp-auth-tests:
    name: OTP signup and password-reset tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/inventoryDB
      JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production-123456789
      OTP_SECRET: ci-only-otp-secret-do-not-use-in-production-123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OTP_DEV_RETURN_CODE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start MongoDB replica set for transaction-backed API tests
        run: |
          docker run --detach --name inventory-mongo-test --publish 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec inventory-mongo-test mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec inventory-mongo-test mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec inventory-mongo-test mongosh --quiet --eval 'try { rs.status().ok } catch(e) { 0 }' | grep -q 1; then exit 0; fi
            sleep 2
          done
          docker logs inventory-mongo-test
          exit 1
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run auth API and browser tests
        run: npx playwright test --project=chromium tests/api/auth.api.spec.ts tests/auth/auth.spec.ts

  live-site-smoke:
    name: Live website smoke tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://inventory-system-mu-puce.vercel.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for desktop and mobile emulation
        run: npx playwright install --with-deps chromium
      - name: Test deployed website in desktop and mobile viewports
        run: npx playwright test --config=playwright.live.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-playwright-report
          path: |
            playwright-live-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
