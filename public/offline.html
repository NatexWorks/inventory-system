<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>You're offline · Inventory System</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 520px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: white; box-shadow: 0 18px 50px #0f172a12; }
      h1 { margin: 0 0 12px; font-size: 1.6rem; }
      p { color: #475569; }
      button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 18px; background: #4f46e5; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>The internet connection is unavailable. Reopen a screen you've visited before, or reconnect and retry. Saved supported changes will sync when the app is open and the same account can be verified.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
